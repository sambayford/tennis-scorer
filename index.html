<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tennis Scorer</title>
<style>
:root{--bg:#0e1a15;--card:#162620;--tx:#eef5f0;--mut:#8fa89a;--p0:#f5d547;--p1:#5ec8ff;--ln:#25382f;--ball:#c6e03a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:480px;margin:0 auto}
h1{font-size:1.4rem;margin:.2rem 0 1rem}
label{display:block;color:var(--mut);font-size:.8rem;margin-bottom:.7rem}
input{display:block;width:100%;margin-top:.25rem;padding:.7rem .8rem;font:inherit;font-size:1.05rem;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;-webkit-user-select:text;user-select:text}
.lbl{color:var(--mut);font-size:.8rem;margin:.9rem 0 .3rem}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;padding:.7rem .3rem;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
.go{width:100%;margin-top:1.4rem;padding:1rem;font:inherit;font-size:1.1rem;font-weight:700;color:#0e1a15;background:var(--p0);border:0;border-radius:12px}
.board{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:.4rem .8rem}
.row{display:flex;align-items:center;padding:.55rem 0}
.row+.row{border-top:1px solid var(--ln)}
.row.hd{padding:.35rem 0;color:var(--mut);font-size:.7rem}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.15rem;font-weight:600}
.p0 .nm{color:var(--p0)}
.p1 .nm{color:var(--p1)}
.ball{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--ball);margin-right:.45em}
.ball.off{visibility:hidden}
.c{width:2rem;text-align:center;font-size:1.15rem;font-variant-numeric:tabular-nums}
.c.w{font-weight:700}
.c sup{font-size:.6em;margin-left:1px}
.c.pt{width:3.6rem;font-size:1.9rem;font-weight:700}
.p0 .c.pt{color:var(--p0)}
.p1 .c.pt{color:var(--p1)}
.row.hd .c{font-size:.7rem;font-weight:400}
.row.hd .c.pt{font-size:.7rem;font-weight:400}
.row.win .nm::after{content:" \1F3C6"}
.status{min-height:1.6rem;text-align:center;margin:.8rem 0 .5rem;color:var(--ball);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pt-btn{height:clamp(130px,30vh,240px);border:0;border-radius:16px;font:inherit;font-size:1.3rem;font-weight:700;color:#0e1a15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.5rem;overflow:hidden}
.pt-btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-btn small{font-size:.75rem;font-weight:500;opacity:.75}
.pt-btn:active{transform:scale(.97);filter:brightness(.9)}
.pt-btn.p0{background:var(--p0)}
.pt-btn.p1{background:var(--p1)}
.bar{display:flex;gap:10px;margin-top:10px}
.bar button{flex:1;padding:.8rem;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px}
.bar button:disabled{opacity:.35}
.result{text-align:center;margin:1rem 0 .6rem}
.result b{font-size:1.5rem}
.result div{color:var(--mut);margin-top:.3rem;font-size:1.1rem;font-variant-numeric:tabular-nums}
.st{width:100%;border-collapse:collapse;margin:.6rem 0 .2rem}
.st td{padding:.55rem 0;border-top:1px solid var(--ln);text-align:center;font-variant-numeric:tabular-nums;width:33%}
.st td.lb{color:var(--mut);font-size:.8rem}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---- core scoring logic (pure, no DOM) ----
const KEY='tennisScorer.v1';
const need=s=>Math.ceil(s.cfg.best/2);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function newMatch(cfg){
  return{cfg,sets:[],g:[0,0],p:[0,0],tb:false,sup:false,srv:cfg.first,tbFirst:0,win:null,pw:[0,0],sp:[0,0],spw:[0,0],gw:[0,0]};
}
function setsWon(s){const w=[0,0];s.sets.forEach(x=>w[x.w]++);return w;}
function isFinal(s){const w=setsWon(s),n=need(s);return w[0]===n-1&&w[1]===n-1;}
function pointServer(s){
  if(s.tb||s.sup){const n=s.p[0]+s.p[1];return Math.floor((n+1)/2)%2===0?s.tbFirst:1-s.tbFirst;}
  return s.srv;
}
function endGame(s,p,ev){
  const o=1-p,wasTb=s.tb,tbPts=[s.p[0],s.p[1]];
  ev.game=true;
  s.gw[p]++;
  s.g[p]++;
  s.p=[0,0];
  const setWon=wasTb||(s.g[p]>=6&&s.g[p]-s.g[o]>=2);
  if(!setWon){
    s.srv=1-s.srv;
    if(s.g[0]===6&&s.g[1]===6&&!(isFinal(s)&&s.cfg.final==='adv')){s.tb=true;s.tbFirst=s.srv;}
    return;
  }
  s.sets.push({g:[s.g[0],s.g[1]],tb:wasTb?tbPts:null,w:p});
  s.g=[0,0];
  s.tb=false;
  ev.set=true;
  const w=setsWon(s),n=need(s);
  if(w[p]>=n){s.win=p;ev.match=true;return;}
  s.srv=wasTb?1-s.tbFirst:1-s.srv;
  if(s.cfg.final==='sup'&&w[0]===n-1&&w[1]===n-1){s.sup=true;s.tbFirst=s.srv;}
}
function apply(s,p){
  const o=1-p,ev={game:false,set:false,match:false};
  if(s.win!==null)return ev;
  const srv=pointServer(s);
  s.pw[p]++;s.sp[srv]++;if(srv===p)s.spw[p]++;
  s.p[p]++;
  if(s.sup){
    if(s.p[p]>=10&&s.p[p]-s.p[o]>=2){
      s.sets.push({g:[0,0],sup:[s.p[0],s.p[1]],w:p});
      s.win=p;ev.game=ev.set=ev.match=true;
    }
    return ev;
  }
  if(s.tb){
    if(s.p[p]>=7&&s.p[p]-s.p[o]>=2)endGame(s,p,ev);
    return ev;
  }
  const a=s.p[p],b=s.p[o];
  if(s.cfg.noAd?a>=4:(a>=4&&a-b>=2))endGame(s,p,ev);
  return ev;
}
function peek(s,p){return apply(JSON.parse(JSON.stringify(s)),p);}
function ptText(s,p){
  if(s.tb||s.sup)return String(s.p[p]);
  const a=s.p[p],b=s.p[1-p];
  if(a>=3&&b>=3&&!s.cfg.noAd)return a>b?'Ad':'40';
  return['0','15','30','40'][a];
}
function status(s){
  if(s.win!==null)return'';
  const srv=pointServer(s),sc=[0,0];
  for(const p of[0,1]){
    const e=peek(s,p);
    sc[p]=e.match?4:e.set?3:e.game?((s.tb||s.sup||p===srv)?1:2):0;
  }
  const top=Math.max(sc[0],sc[1]);
  if(!s.tb&&!s.sup&&s.cfg.noAd&&s.p[0]===3&&s.p[1]===3&&top<=2)return'Deciding point';
  if(top){
    const L=['','Game point','Break point','Set point','Match point'][top];
    const who=sc[0]===sc[1]?'':' · '+esc(s.cfg.n[sc[0]===top?0:1]);
    return(s.sup?'Match tiebreak · ':s.tb?'Tiebreak · ':'')+L+who;
  }
  if(s.sup)return'Match tiebreak';
  if(s.tb)return'Tiebreak';
  if(!s.cfg.noAd&&s.p[0]>=3&&s.p[0]===s.p[1])return'Deuce';
  return'';
}
</script>

<script>
// ---- UI ----
const $=id=>document.getElementById(id);
let S=null,H=[],setup={n:['Player 1','Player 2'],best:3,final:'tb',noAd:false,first:'r'},wl=null;
try{
  const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d){
    if(d.setup&&Array.isArray(d.setup.n))setup=Object.assign(setup,d.setup);
    if(d.S&&d.S.cfg&&Array.isArray(d.S.sets)){S=d.S;H=Array.isArray(d.H)?d.H:[];}
  }
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,H,setup}));}catch(e){}}
async function lock(){
  try{
    if(S&&S.win===null&&'wakeLock' in navigator&&!wl){
      wl=await navigator.wakeLock.request('screen');
      wl.addEventListener('release',()=>{wl=null;});
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock();});

function seg(key,opts,cur){
  return'<div class="seg">'+opts.map(([v,l])=>`<button data-seg="${key}" data-v="${v}" class="${String(v)===String(cur)?'on':''}">${l}</button>`).join('')+'</div>';
}
function viewSetup(){
  const n=setup.n;
  return`<h1>Tennis Scorer</h1>
<label>Player 1<input id="n0" maxlength="20" value="${esc(n[0])}" autocomplete="off"></label>
<label>Player 2<input id="n1" maxlength="20" value="${esc(n[1])}" autocomplete="off"></label>
<div class="lbl">Best of</div>${seg('best',[[3,'3 sets'],[5,'5 sets']],setup.best)}
<div class="lbl">Final set</div>${seg('final',[['tb','Tiebreak'],['adv','Advantage'],['sup','Match TB (10)']],setup.final)}
<div class="lbl">Games</div>${seg('noAd',[[0,'Advantage'],[1,'No-Ad']],setup.noAd?1:0)}
<div class="lbl">First serve</div>${seg('first',[[0,esc(n[0]||'Player 1')],[1,esc(n[1]||'Player 2')],['r','Random']],setup.first)}
<button class="go" data-act="start">Start match</button>`;
}
function setCell(x,i){
  if(x.sup)return x.sup[i];
  return x.g[i]+(x.tb&&x.g[i]===6?`<sup>${x.tb[i]}</sup>`:'');
}
function viewBoard(){
  const s=S,n=s.cfg.n,done=s.win!==null,srv=pointServer(s);
  const hd=`<div class="row hd"><span class="nm"></span>${s.sets.map((x,i)=>`<span class="c">${i+1}</span>`).join('')}${done?'':'<span class="c">Gm</span><span class="c pt">Pt</span>'}</div>`;
  const row=i=>`<div class="row p${i}${done&&s.win===i?' win':''}"><span class="nm"><i class="ball${!done&&srv===i?'':' off'}"></i>${esc(n[i])}</span>${s.sets.map(x=>`<span class="c${x.w===i?' w':''}">${setCell(x,i)}</span>`).join('')}${done?'':`<span class="c">${s.sup?'–':s.g[i]}</span><span class="c pt">${ptText(s,i)}</span>`}</div>`;
  let h=`<div class="board">${hd}${row(0)}${row(1)}</div>`;
  const bar=`<div class="bar"><button data-act="undo"${H.length?'':' disabled'}>&#8630; Undo</button><button data-act="new">New match</button></div>`;
  if(!done){
    h+=`<div class="status">${status(s)||'&nbsp;'}</div>
<div class="btns">${[0,1].map(i=>`<button class="pt-btn p${i}" data-act="pt" data-p="${i}"><span>${esc(n[i])}</span><small>wins point</small></button>`).join('')}</div>`+bar;
  }else{
    const w=s.win;
    const line=s.sets.map(x=>x.sup?`[${x.sup[w]}-${x.sup[1-w]}]`:`${x.g[w]}-${x.g[1-w]}${x.tb?`(${Math.min(x.tb[0],x.tb[1])})`:''}`).join(' ');
    const r=(a,l,b)=>`<tr><td>${a}</td><td class="lb">${l}</td><td>${b}</td></tr>`;
    h+=`<div class="result"><b>${esc(n[w])} wins</b><div>${line}</div></div>
<table class="st">${r(s.pw[0],'Points won',s.pw[1])}${r(s.spw[0]+'/'+s.sp[0],'Service pts won',s.spw[1]+'/'+s.sp[1])}${r(s.gw[0],'Games won',s.gw[1])}</table>`+bar;
  }
  return h;
}
function render(){
  $('app').innerHTML=S?viewBoard():viewSetup();
  lock();
}
$('app').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  if(b.dataset.seg){
    const k=b.dataset.seg,v=b.dataset.v;
    setup[k]=k==='best'?Number(v):k==='noAd'?v==='1':k==='first'?(v==='r'?'r':Number(v)):v;
    save();render();return;
  }
  switch(b.dataset.act){
    case'pt':
      if(!S||S.win!==null)return;
      H.push(JSON.stringify(S));
      if(H.length>1500)H.shift();
      apply(S,+b.dataset.p);
      break;
    case'undo':
      if(!H.length)return;
      S=JSON.parse(H.pop());
      break;
    case'new':
      if(S.win===null&&H.length&&!confirm('Abandon this match?'))return;
      S=null;H=[];
      break;
    case'start':{
      const n=[0,1].map(i=>($('n'+i).value||'').trim()||'Player '+(i+1));
      setup.n=n;
      const first=setup.first==='r'?(Math.random()<.5?0:1):setup.first;
      S=newMatch({n,best:setup.best,final:setup.final,noAd:setup.noAd,first});
      H=[];
      break;
    }
    default:return;
  }
  save();render();
});
$('app').addEventListener('input',e=>{
  const m=/^n([01])$/.exec(e.target.id||'');
  if(!m)return;
  const i=+m[1];
  setup.n[i]=e.target.value;
  const sb=document.querySelector(`[data-seg="first"][data-v="${i}"]`);
  if(sb)sb.textContent=e.target.value.trim()||'Player '+(i+1);
  save();
});
render();
</script>
</body>
</html>
